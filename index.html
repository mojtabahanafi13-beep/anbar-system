<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0f172a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="انبارداری">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" type="image/svg+xml" href="./logo.svg">
  <link rel="apple-touch-icon" href="./logo.svg">
  <title>سیستم انبارداری هولدینگ</title>
  <style>
    :root{color-scheme:light}
    html,body{min-height:100%;margin:0}
    body{font-family:Tahoma,Arial,sans-serif;background:linear-gradient(135deg,#f8fafc,#e2e8f0);color:#0f172a;display:flex;align-items:center;justify-content:center;padding:24px;box-sizing:border-box}
    .box{width:min(520px,100%);background:#fff;border:1px solid #cbd5e1;border-radius:22px;padding:28px;box-shadow:0 18px 50px rgba(15,23,42,.15);text-align:center}
    .logo{width:130px;height:130px;object-fit:contain;margin:0 auto 12px}
    h1{font-size:24px;margin:10px 0}
    p{line-height:1.9;color:#475569;font-size:14px}
    .actions{display:grid;gap:10px;margin-top:18px}
    button,a{font:inherit;border:0;border-radius:12px;padding:13px 16px;text-decoration:none;cursor:pointer}
    .primary{background:#16a34a;color:#fff;font-weight:800}
    .secondary{background:#0f172a;color:#fff;font-weight:800}
    .guide{margin-top:14px;background:#eff6ff;border:1px solid #bfdbfe;color:#1e3a8a;border-radius:12px;padding:12px;font-size:13px;line-height:1.8}
    .muted{font-size:11px;color:#64748b;margin-top:16px}
    .hidden{display:none!important}
  </style>
</head>
<body>
  <main class="box">
    <img class="logo" src="./logo.svg" alt="لوگوی شرکت">
    <h1>سیستم انبارداری هولدینگ</h1>
    <p>نسخه جدید و رسمی سیستم روی سرور اصلی در دسترس است.</p>

    <div id="installArea" class="actions hidden">
      <button id="installBtn" class="primary">📱 نصب اپلیکیشن روی گوشی</button>
      <a class="secondary" href="https://app.factor-anbar.online/">ورود به سیستم</a>
    </div>

    <div id="iosGuide" class="guide hidden">
      در سافاری، از دکمه‌ی اشتراک‌گذاری، گزینه‌ی «افزودن به صفحه‌ی اصلی» را بزنید.
    </div>

    <div id="fallbackArea" class="actions">
      <a class="primary" href="https://app.factor-anbar.online/">ورود به نسخه جدید سیستم</a>
    </div>

    <div class="muted">برای استفاده از آخرین قابلیت‌ها از آدرس اصلی سیستم استفاده کنید.</div>
  </main>

  <script>
    (function () {
      const productionUrl = 'https://app.factor-anbar.online/';
      const installArea = document.getElementById('installArea');
      const installBtn = document.getElementById('installBtn');
      const iosGuide = document.getElementById('iosGuide');
      const fallbackArea = document.getElementById('fallbackArea');

      let deferredPrompt = null;

      function isIOS() {
        const ua = navigator.userAgent || navigator.vendor || '';
        return /iPad|iPhone|iPod/i.test(ua) ||
          (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
      }

      function isStandalone() {
        return window.matchMedia('(display-mode: standalone)').matches ||
          (window.navigator.standalone === true);
      }

      if (!isStandalone()) {
        window.addEventListener('beforeinstallprompt', function (event) {
          event.preventDefault();
          deferredPrompt = event;
          installArea.classList.remove('hidden');
          fallbackArea.classList.add('hidden');
        });

        installBtn.addEventListener('click', async function () {
          if (!deferredPrompt) return;
          await deferredPrompt.prompt();
          try { await deferredPrompt.userChoice; } catch (_) {}
          deferredPrompt = null;
          installArea.classList.add('hidden');
          fallbackArea.classList.remove('hidden');
        });

        if (isIOS()) {
          iosGuide.classList.remove('hidden');
          fallbackArea.classList.remove('hidden');
        }
      }

      window.addEventListener('appinstalled', function () {
        deferredPrompt = null;
        installArea.classList.add('hidden');
      });

      // ورود خودکار به Production برای کاربران معمولی؛ با مکث کوتاه برای نمایش لوگو.
      setTimeout(function () {
        if (!isStandalone()) {
          window.location.replace(productionUrl);
        }
      }, 1800);
    })();
  </script>
</body>
</html>
