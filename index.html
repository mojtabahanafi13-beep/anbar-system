    <script>
    /* ===================================================================
       PWA Install Manager
       - رویداد beforeinstallprompt رو زودهنگام (قبل از رندر بقیه اپ) گوش میده و ذخیره می‌کنه
       - فقط Chromium/Android این رویداد رو ساپورت می‌کنه؛ iOS/Safari نداره
       - اگر اپ از قبل نصب شده (standalone) هیچ اقدامی نمی‌کنه
       =================================================================== */
    window.PWAInstall = (function () {
        var deferredPrompt = null;
        var listeners = [];

        function isStandalone() {
            var byMedia = window.matchMedia && window.matchMedia('(display-mode: standalone)').matches;
            var byIOS = ('standalone' in window.navigator) && window.navigator.standalone === true;
            return !!(byMedia || byIOS);
        }

        function isIOS() {
            var ua = window.navigator.userAgent || window.navigator.vendor || window.opera || '';
            var iOSDevice = /iPad|iPhone|iPod/.test(ua) && !window.MSStream;
            // آیپدهای جدید که خودشون رو مک معرفی می‌کنن ولی صفحه لمسی دارن
            var iPadOS13Up = navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1;
            return iOSDevice || iPadOS13Up;
        }

        function notify() {
            listeners.forEach(function (fn) {
                try { fn(getState()); } catch (e) {}
            });
        }

        function getState() {
            return {
                standalone: isStandalone(),
                ios: isIOS(),
                canPromptInstall: !!deferredPrompt
            };
        }

        window.addEventListener('beforeinstallprompt', function (e) {
            e.preventDefault();
            deferredPrompt = e;
            notify();
        });

        window.addEventListener('appinstalled', function () {
            deferredPrompt = null;
            notify();
        });

        // ثبت سرویس‌ورکر (برای معیار قابل‌نصب بودن در کروم لازم است)
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', function () {
                navigator.serviceWorker.register('sw.js').catch(function () {});
            });
        }

        return {
            getState: getState,
            isStandalone: isStandalone,
            isIOS: isIOS,
            onChange: function (fn) { listeners.push(fn); },
            promptInstall: function () {
                if (!deferredPrompt) return Promise.resolve({ outcome: 'unavailable' });
                deferredPrompt.prompt();
                return deferredPrompt.userChoice.then(function (choice) {
                    deferredPrompt = null;
                    notify();
                    return choice;
                });
            }
        };
    })();
    </script>
