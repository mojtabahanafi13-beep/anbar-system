name: Build Rojin Dashboard APK

on:
  push:
    branches:
      - main
      - feat/rojin-dashboard-android
      - feat/native-dashboard-app
    paths:
      - 'dashboard-android/**'
      - '.github/workflows/build-dashboard-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-rojin-dashboard-apk
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'
          cache-disabled: true

      - name: Build dashboard APK
        run: gradle -p dashboard-android assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: cp dashboard-android/app/build/outputs/apk/debug/app-debug.apk Rojin-Dashboard.apk

      - name: Upload dashboard APK
        uses: actions/upload-artifact@v4
        with:
          name: Rojin-Dashboard-APK
          path: Rojin-Dashboard.apk
          if-no-files-found: error
          retention-days: 30
